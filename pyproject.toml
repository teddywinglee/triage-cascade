[project]
name = "triage-cascade"
version = "0.1.0"
description = "Support-ticket triage: a fast classifier answers first and a local LLM handles only the tickets it can't."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "laya>=0.3.22",
    "langgraph>=1.2",
    "langchain-openai>=1.6",
    "fastapi>=0.142",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.6"]

[tool.setuptools]
packages = ["pipeline", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Hand-written test tickets and their expected labels read best one per line.
"scripts/check_env.py" = ["E501"]
